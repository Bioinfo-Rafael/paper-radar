[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-radar"
version = "0.1.0"
description = "Explainable, rule-based research paper radar for Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11,<7",
  "huggingface-hub>=1.0,<2",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

