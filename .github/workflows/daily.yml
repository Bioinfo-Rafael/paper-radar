name: Daily Paper Radar

on:
  schedule:
    # 23:15 UTC = 08:15 JST on the following day.
    - cron: "15 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-radar-daily
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Fetch, rank, and notify
        env:
          DISCORD_BIOINFO_WEBHOOK: ${{ secrets.DISCORD_BIOINFO_WEBHOOK }}
          DISCORD_ML_WEBHOOK: ${{ secrets.DISCORD_ML_WEBHOOK }}
          DISCORD_FRONTIER_WEBHOOK: ${{ secrets.DISCORD_FRONTIER_WEBHOOK }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python -m paper_radar.cli daily --category all
      - name: Persist deduplication state and /more candidates
        run: |
          if git diff --quiet -- state/sent.json state/candidates.json; then
            exit 0
          fi
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar[bot]@users.noreply.github.com"
          git add state/sent.json state/candidates.json
          git commit -m "chore(state): persist paper radar run"
          git push

