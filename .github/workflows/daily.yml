name: Daily Paper Radar

on:
  schedule:
    # GitHub may delay scheduled jobs during periods of high Actions load.
    - cron: "0 21 * * *" # 06:00 JST on the following day
    - cron: "0 0 * * *" # 09:00 JST
    - cron: "0 3 * * *" # 12:00 JST
    - cron: "0 6 * * *" # 15:00 JST
    - cron: "0 9 * * *" # 18:00 JST
  workflow_dispatch:
    inputs:
      category:
        description: Radar category (all is used for a full manual run)
        required: false
        default: all
        type: choice
        options: [all, bioinfo, ml, frontier]

permissions:
  contents: write

concurrency:
  group: paper-radar-state
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Fetch, rank, and notify
        env:
          DISCORD_BIOINFO_WEBHOOK: ${{ secrets.DISCORD_BIOINFO_WEBHOOK }}
          DISCORD_ML_WEBHOOK: ${{ secrets.DISCORD_ML_WEBHOOK }}
          DISCORD_FRONTIER_WEBHOOK: ${{ secrets.DISCORD_FRONTIER_WEBHOOK }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: >-
          python -m paper_radar.cli daily
          --category "${{ github.event.inputs.category || 'all' }}"
      - name: Persist deduplication state and audit candidates
        run: |
          if git diff --quiet -- state/sent.json state/candidates.json; then
            exit 0
          fi
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar[bot]@users.noreply.github.com"
          git add state/sent.json state/candidates.json
          git commit -m "chore(state): persist paper radar run"
          git push
